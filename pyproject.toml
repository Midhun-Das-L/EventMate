[project]
name = "eventmate-mcp"
version = "0.1.0"
description = "EventMate: an MCP server that helps Claude organise any event - attendees, check-in, agenda, tasks and shared expenses."
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["mcp>=2.3,<3"]

[project.scripts]
eventmate-mcp = "eventmate.server:main"

[project.optional-dependencies]
dev = ["pytest>=8", "anyio>=4"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/eventmate"]
